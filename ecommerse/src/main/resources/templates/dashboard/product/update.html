<!DOCTYPE html>
<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body >
<div layout:fragment="body">
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <input type="text" name="name" th:value="${product.name}" class="form-control col-4"
                   placeholder="Name" required/>
        </div>
        <div class="form-group">
            <input type="text" name="price" th:value="${product.price}" class="form-control col-4"
                   placeholder="Price" required/>
        </div>

        <div class="form-group">
            <input type="text" name="description" th:value="${product.description}" class="form-control col-4" required/>
        </div>
        <div class="form-group">
            <input type="text" name="categoryId" th:value="${product.categoryId}" class="form-control col-4"
                   placeholder="PhoneNumber" required/>
        </div>
        <div class="form-group">
            <input type="text" name="discountDate" th:value="${product.discountDate}" class="form-control col-4"
                   placeholder="Address" required/>
        </div>

        <div class="form-group">
            <input type="text" name="discountPrice" th:value="${product.discountPrice}" class="form-control col-4" required/>
        </div>

        <div class="form-group">
            <input type="text" name="featured" th:value="${product.featured}" class="form-control col-4" required/>
        </div>
        <div class="form-group">
            <input type="text" name="quantity" th:value="${product.quantity}" class="form-control col-4" required/>
        </div>


        <div class="form-group">
            <input type="submit" value="Update" class="btn btn-success"/>
        </div>

</div>

</body>
</html>
