<!DOCTYPE html>
<html
        xmlns:th="http://thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{/dashboard/layout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body >
<div layout:fragment="body">
    <a th:href="@{/dashboard/product/create}" class="btn btn-outline-success">Create</a>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Product name</th>
            <th scope="col">Price</th>
            <th scope="col">Quantity</th>
            <th scope="col">Description</th>
            <th scope="col">DiscountDate</th>
            <th scope="col">DiscountPrice</th>
            <th scope="col">Featured</th>
            <th scope="col">Category</th>

            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product: ${products}">
            <th th:text="${product.id}"  scope="row">1</th>
            <td th:text="${product.name}">Mark</td>
            <td th:text="${product.price}">Mark</td>
            <td th:text="${product.quantity}">Mark</td>
            <th th:text="${product.description}"  scope="row">1</th>
            <td th:text="${product.discountDate}">Mark</td>
            <td th:text="${product.discountPrice}">Mark</td>
            <td th:text="${product.featured}">Mark</td>
            <td th:text="${product.category.id}">Mark</td>
            <td>
                <a th:href="'/dashboard/product/update/'+${product.id}" class="btn btn-outline-warning">update</a>
                <a th:href="'/dashboard/product/delete/'+${product.id}" class="btn btn-outline-danger">delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
